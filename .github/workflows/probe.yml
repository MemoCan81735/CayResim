name: API-Probe
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Signaturen auslesen
        run: |
          exec > >(tee probe.log) 2>&1
          G=https://dl.google.com/dl/android/maven2
          get() { mkdir -p "x/$2"; curl -sL "$G/$1" -o "x/$2.aar"; (cd "x/$2" && unzip -qo "../$2.aar" classes.jar && unzip -qo classes.jar); }
          get androidx/camera/camera-core/1.6.2/camera-core-1.6.2.aar core
          get androidx/camera/camera-compose/1.6.2/camera-compose-1.6.2.aar compose
          get androidx/navigation3/navigation3-runtime/1.2.0/navigation3-runtime-1.2.0.aar nav3rt
          get androidx/navigation3/navigation3-ui/1.2.0/navigation3-ui-1.2.0.aar nav3ui
          get androidx/hilt/hilt-lifecycle-viewmodel-compose/1.4.0/hilt-lifecycle-viewmodel-compose-1.4.0.aar hiltvm
          get androidx/lifecycle/lifecycle-viewmodel-navigation3/2.11.0/lifecycle-viewmodel-navigation3-2.11.0.aar vmnav3
          for c in core:androidx/camera/core/ImageCaptureCapabilities core:androidx/camera/core/SurfaceRequest; do d=${c%%:*}; k=${c#*:}; echo "=== $k"; javap -cp x/$d "$k" | grep public | head -30; done
          javap -cp x/compose androidx.camera.compose.CameraXViewfinderKt
          for d in nav3rt nav3ui hiltvm vmnav3; do echo "##### $d"; (cd x/$d && find . -name '*.class' | grep -v '\$' | sed 's|^\./||;s|\.class$||' ) | while read k; do javap -cp x/$d "$k" 2>/dev/null | grep -E "public" | grep -vE "synthetic|lambda|ComposableSingletons" | cut -c1-400; done; done
          echo "##### poms"
          curl -s $G/androidx/navigation3/navigation3-runtime/1.2.0/navigation3-runtime-1.2.0.pom | grep -A2 artifactId | head -40
          curl -sI $G/androidx/lifecycle/lifecycle-viewmodel-navigation3/maven-metadata.xml | head -1
          curl -s $G/androidx/lifecycle/lifecycle-viewmodel-navigation3/maven-metadata.xml | grep -oP '(?<=<version>)[^<]+' | tail -4
      - name: Log ablegen
        if: always()
        run: |
          mkdir out && cp probe.log out/ && cd out
          git init -q && git checkout -q -b ci-logs
          git config user.name ci && git config user.email ci@local
          git add . && git commit -qm "log $GITHUB_RUN_ID"
          git push -f -q https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} ci-logs
