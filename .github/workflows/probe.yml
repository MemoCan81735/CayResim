name: Versionen ermitteln
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Neueste stabile Versionen
        run: |
          exec > >(tee probe.log) 2>&1
          latest() { curl -s "$1/maven-metadata.xml" | grep -oP '(?<=<version>)[^<]+' | grep -viE 'alpha|beta|rc|dev|-M' | sort -V | tail -1; }
          G=https://dl.google.com/dl/android/maven2
          C=https://repo1.maven.org/maven2
          P=https://plugins.gradle.org/m2
          echo "AGP $(latest $G/com/android/tools/build/gradle)"
          echo "Kotlin $(latest $C/org/jetbrains/kotlin/kotlin-gradle-plugin)"
          echo "KSP $(curl -s $C/com/google/devtools/ksp/symbol-processing-gradle-plugin/maven-metadata.xml | grep -oP '(?<=<version>)[^<]+' | tail -5 | tr '\n' ' ')"
          echo "Hilt $(latest $C/com/google/dagger/hilt-android)"
          echo "ComposeBOM $(latest $G/androidx/compose/compose-bom)"
          echo "CameraX $(latest $G/androidx/camera/camera-core)"
          echo "CameraCompose $(latest $G/androidx/camera/camera-compose)"
          echo "Viewfinder $(latest $G/androidx/camera/viewfinder/viewfinder-compose)"
          echo "CameraMedia3 $(curl -s $G/androidx/camera/media3/media3-effect/maven-metadata.xml | grep -oP '(?<=<version>)[^<]+' | tail -3 | tr '\n' ' ')"
          echo "Media3 $(latest $G/androidx/media3/media3-transformer)"
          echo "Room $(latest $G/androidx/room/room-runtime)"
          echo "DataStore $(latest $G/androidx/datastore/datastore-preferences)"
          echo "Lifecycle $(latest $G/androidx/lifecycle/lifecycle-runtime-compose)"
          echo "Activity $(latest $G/androidx/activity/activity-compose)"
          echo "Nav3 $(latest $G/androidx/navigation3/navigation3-runtime)"
          echo "HiltNav $(latest $G/androidx/hilt/hilt-navigation-compose)"
          echo "HiltLifecycleVM $(curl -s $G/androidx/hilt/hilt-lifecycle-viewmodel-compose/maven-metadata.xml | grep -oP '(?<=<version>)[^<]+' | tail -3 | tr '\n' ' ')"
          echo "Coroutines $(latest $C/org/jetbrains/kotlinx/kotlinx-coroutines-core)"
          echo "ImmutableColl $(curl -s $C/org/jetbrains/kotlinx/kotlinx-collections-immutable/maven-metadata.xml | grep -oP '(?<=<version>)[^<]+' | tail -3 | tr '\n' ' ')"
          echo "Konsist $(latest $C/com/lemonappdev/konsist)"
          echo "Turbine $(latest $C/app/cash/turbine/turbine)"
          echo "LeakCanary $(latest $C/com/squareup/leakcanary/leakcanary-android)"
          echo "MLKitSubject $(curl -s $G/com/google/android/gms/play-services-mlkit-subject-segmentation/maven-metadata.xml | grep -oP '(?<=<version>)[^<]+' | tail -3 | tr '\n' ' ')"
          echo "Exif $(latest $G/androidx/exifinterface/exifinterface)"
          echo "Gradle $(curl -s https://services.gradle.org/versions/current | grep -oP '(?<="version" : ")[^"]+')"
          echo "ComposePluginCheck $(curl -s -o /dev/null -w '%{http_code}' $C/org/jetbrains/kotlin/plugin/compose/org.jetbrains.kotlin.plugin.compose.gradle.plugin/maven-metadata.xml)"
          ls $ANDROID_HOME/platforms; ls $ANDROID_HOME/build-tools
      - name: Log ablegen
        if: always()
        run: |
          mkdir out && cp probe.log out/ && cd out
          git init -q && git checkout -q -b ci-logs
          git config user.name ci && git config user.email ci@local
          git add . && git commit -qm "log $GITHUB_RUN_ID"
          git push -f -q https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} ci-logs
