name: API-Probe
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Signaturen auslesen
        run: |
          exec > >(tee probe.log) 2>&1
          G=https://dl.google.com/dl/android/maven2
          get() { mkdir -p "x/$2"; curl -sL "$G/$1" -o "x/$2.aar"; (cd "x/$2" && unzip -qo "../$2.aar" classes.jar && unzip -qo classes.jar); }
          get androidx/camera/camera-core/1.6.2/camera-core-1.6.2.aar core
          get androidx/camera/camera-lifecycle/1.6.2/camera-lifecycle-1.6.2.aar lifecycle
          get androidx/camera/camera-extensions/1.6.2/camera-extensions-1.6.2.aar ext
          get androidx/camera/camera-compose/1.6.2/camera-compose-1.6.2.aar compose
          get androidx/camera/camera-camera2/1.6.2/camera-camera2-1.6.2.aar c2
          for c in core:androidx/camera/core/SessionConfig core:androidx/camera/core/SessionConfig\$Builder core:androidx/camera/core/CameraInfo core:androidx/camera/core/ImageCapture core:androidx/camera/core/ImageCapture\$Builder core:androidx/camera/core/ImageCapture\$OutputFileOptions\$Builder core:androidx/camera/core/Preview core:androidx/camera/core/Preview\$Builder core:androidx/camera/core/CameraControl core:androidx/camera/core/ImageAnalysis\$Builder lifecycle:androidx/camera/lifecycle/ProcessCameraProvider lifecycle:androidx/camera/lifecycle/ProcessCameraProvider\$Companion lifecycle:androidx/camera/lifecycle/ProcessCameraProviderExtKt ext:androidx/camera/extensions/ExtensionsManager ext:androidx/camera/extensions/ExtensionSessionConfig ext:androidx/camera/extensions/ExtensionMode c2:androidx/camera/camera2/interop/Camera2Interop\$Extender c2:androidx/camera/camera2/interop/Camera2CameraControl; do
            d=${c%%:*}; k=${c#*:}; echo "=== $k"; javap -cp x/$d "$k" 2>&1 | head -80; done
          echo "=== compose classes"; (cd x/compose && find . -name '*.class' | head -30)
          for k in $(cd x/compose && find . -name 'CameraXViewfinder*Kt.class' | sed 's|^\./||;s|\.class$||'); do echo "=== $k"; javap -cp x/compose "$k"; done
          echo "=== ext classes"; (cd x/ext && find . -name '*.class' | grep -v '/impl/\|/internal/' | head -40)
      - name: Log ablegen
        if: always()
        run: |
          mkdir out && cp probe.log out/ && cd out
          git init -q && git checkout -q -b ci-logs
          git config user.name ci && git config user.email ci@local
          git add . && git commit -qm "log $GITHUB_RUN_ID"
          git push -f -q https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} ci-logs
